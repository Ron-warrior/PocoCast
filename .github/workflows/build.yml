name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The sender library is licensed under PolyForm Noncommercial 1.0.0, so it
      # is fetched at build time instead of being committed to this repository.
      - name: Fetch the sender library
        run: bash scripts/bootstrap.sh

      # Keeps the signing key between runs. Without this every build would have a
      # different key and Android would refuse to install a new build over the
      # one already on the phone.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pococast-debug-signing-key

      - name: Keep one signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      # A release build, not a debug one: debuggable APKs are what Play Protect
      # treats as unsafe, and the release variant is signed with the same key so
      # updates still install over the copy already on the phone.
      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pococast-release
          path: app/build/outputs/apk/release/*.apk

      # One release per version. The asset carries the version in its name so
      # the phone's Downloads folder shows PocoCast-0.4.2.apk instead of a
      # pile of app-release (1).apk files.
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(grep -m1 '^ *versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')"
          if [ -z "$version" ]; then echo "no versionName in app/build.gradle.kts"; exit 1; fi
          asset="PocoCast-${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"
          gh release view "v${version}" >/dev/null 2>&1 || \
            gh release create "v${version}" --title "PocoCast ${version}" \
              --notes "PocoCast ${version} — signed release APK built from ${GITHUB_SHA:0:7}."
          gh release upload "v${version}" "$asset" --clobber
          echo "Published $asset on release v${version}"
